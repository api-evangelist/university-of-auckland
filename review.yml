    removed:
      - what: 22 Figshare-attributed surfaces
        why: >-
          One generic api.figshare.com/v2 contract (info.title "Figshare API", contact
          "Figshare Support") split by refine-openapis into ten per-tag OpenAPIs and eleven
          apis[] entries, plus every artifact derived from it - 22 collections, 2 JSON Schemas,
          1 JSON Structure, 1 example, 1 JSON-LD context, 1 vocabulary, 2 Spectral rulesets,
          scopes, authentication, agentic-access and a capability map. All Figshare's
          engineering under Auckland's name.
      - what: university-of-auckland:unidirectory
        why: Host does not resolve. Confirmed dead, not merely unverified.
      - what: university-of-auckland:figshare-oai
        why: >-
          baseURL was api.figshare.com/v2/oai - Figshare's generic OAI endpoint, shared by every
          customer. Replaced by the institution's own OAI-PMH service on researchspace.auckland.ac.nz
          and by a tenant entry for the Figshare relationship.
