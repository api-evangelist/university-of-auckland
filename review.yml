name: University of Auckland
description: >-
  University of Auckland institutional API footprint review for APIs.json cataloging, run under
  the API Evangelist university pipeline (operator attribution before artifact volume).
url: https://raw.githubusercontent.com/api-evangelist/university-of-auckland/refs/heads/main/review.yml
created: '2026-06-03'
modified: '2026-08-30'
reviews:
  - date: '2026-08-30'
    rating: 3
    method: probed
    summary: >-
      Re-profiled under the university pipeline. The June 2026 review credited this institution
      with a Figshare REST API and OAI-PMH service that are Figshare's contract on Figshare's
      generic host, and with a University Directory API whose host does not resolve. Both claims
      are withdrawn. What the University actually operates, verified live on 2026-08-30, is
      better than the June profile implied in kind and smaller in volume - a real institution-run
      API programme (Kong developer portal at developer.auckland.ac.nz/prd, Kong gateway at
      apis.auckland.ac.nz) publishing two OpenAPI 3.1.0 contracts over PeopleSoft CS9 student
      records, a self-hosted DSpace repository with a live OAI-PMH 2.0 service and a partially
      open REST API, and its own Shibboleth/SAML 2.0 identity provider. Figshare and Ex Libris
      Primo are recorded as tenant relationships with no contract saved. Twenty-two vendor
      surfaces and every artifact derived from them were removed. The correction lowers apparent
      footprint from eleven APIs to five institution-operated surfaces plus two tenancies, and
      that is the pipeline working.
    endpoints:
