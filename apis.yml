  - aid: university-of-auckland:researchspace-oai
    name: ResearchSpace OAI-PMH 2.0 Service
    x-operator: institution
    x-operator-evidence: >-
      Hosted on researchspace.auckland.ac.nz (CNAME dspace-f5vip.itss.auckland.ac.nz, the
      University's own ITSS load balancer). The Identify response names the repository
      "ResearchSpace at The University of Auckland" with adminEmail researchspace@auckland.ac.nz
      and repositoryIdentifier researchspace.auckland.ac.nz.
    description: >-
      Live OAI-PMH 2.0 metadata harvesting endpoint for ResearchSpace, the University's
      self-hosted DSpace institutional repository. Verified 2026-08-30 - Identify returns
      protocolVersion 2.0 and granularity YYYY-MM-DDThh:mm:ssZ; ListMetadataFormats advertises
      thirteen prefixes (oai_dc, qdc, dim, xoai, mods, mets, didl, ore, rdf, marc, etdms,
      uketd_dc, rioxx); ListSets resolves to real institutional collections including A1 Research
      Outputs Online, A2 Digital Doctoral Theses, A4 Dataset Archive, the Auckland Bioengineering
      Institute, CDMTCS Research Reports and Measina o le Pasefika. Records carry handles under
      the 2292 prefix. The software is DSpace's; the deployment, the host, the sets and the
      records are the University's, so the surface is recorded and no DSpace specification is
      saved under this slug.
    humanURL: https://researchspace.auckland.ac.nz/
    baseURL: https://researchspace.auckland.ac.nz/server/oai/request
