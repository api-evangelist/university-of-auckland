  - aid: university-of-auckland:identity-federation
    name: University of Auckland Shibboleth Identity Provider (SAML 2.0 metadata)
    x-operator: institution
    x-operator-evidence: >-
      EntityDescriptor entityID http://iam.auckland.ac.nz/idp, served from the University's own
      host, asserting shibmd:Scope auckland.ac.nz. An identity provider is institution-operated by
      definition - no vendor can assert this scope.
    description: >-
      The University's institutional identity provider, publishing SAML 2.0 metadata at
      https://iam.auckland.ac.nz/shibboleth (200, application/xml). The IDPSSODescriptor declares
      support for urn:oasis:names:tc:SAML:2.0:protocol, urn:oasis:names:tc:SAML:1.1:protocol and
      urn:mace:shibboleth:1.0, with SingleSignOnService endpoints for HTTP-POST,
      HTTP-POST-SimpleSign, HTTP-Redirect and the Shibboleth AuthnRequest profile, plus SAML1 SOAP
      and SAML2 SOAP artifact resolution. Confirmed as the live production SSO rather than stale
      metadata - courseoutline.auckland.ac.nz redirects into
      iam.auckland.ac.nz/profile/SAML2/Redirect/SSO. This is a machine-readable, institution-owned
      surface that almost no university profile in this catalog records.
    humanURL: https://iam.auckland.ac.nz/shibboleth
    baseURL: https://iam.auckland.ac.nz/shibboleth
    tags:
