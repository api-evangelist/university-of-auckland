  - aid: university-of-auckland:figshare-tenant
    name: University of Auckland Figshare Research Data Repository (tenant)
    x-operator: tenant
    x-operator-evidence: >-
      auckland.figshare.com is a CNAME to figshare.com. The institution-specific portal, the
      records and the DOIs (10.17608/k6.auckland.NNNNNNNN) are the University's; the API contract
      at api.figshare.com/v2 is Figshare's and is shared by every Figshare customer. Recorded as a
      relationship, NOT as an Auckland contract.
    description: >-
      The University of Auckland's Figshare research data repository, a vendor tenancy on the
      Figshare platform (institution id 12). Live - the landing page returns HTTP 202 behind an AWS
      WAF challenge, and api.figshare.com/v2/articles?institution=12 returns Auckland-branded
      records with 10.17608/k6.auckland DOIs. This relationship is a genuine institutional fact and
      one of the University's real programmable surfaces, so it is kept. What is NOT kept is the
      Figshare v2 OpenAPI - the June 2026 profile saved it here as ten per-tag documents and eleven
      apis[] entries, inflating one vendor contract into eleven Auckland APIs. Score the contract
      against Figshare's own repo, where it belongs.
    humanURL: https://auckland.figshare.com/
    tags:
      - Research Data
      - Research Repository
      - Tenant
      - Figshare
      - DOI
    properties:
      - type: Website
        url: https://auckland.figshare.com/
