aid: university-of-auckland
name: University of Auckland
x-type: university
x-category: Public Research University
description: >-
  Waipapa Taumata Rau | The University of Auckland is New Zealand's largest and highest-ranked
  university. Unlike most of this cohort it genuinely operates an API programme of its own: a Kong
  gateway at apis.auckland.ac.nz fronted by a public developer portal at developer.auckland.ac.nz,
  which publishes two OpenAPI 3.1.0 contracts — Course Catalog Api V3 and Classes Api V2 — over its
  PeopleSoft Campus Solutions (CS9) student records, plus guides for registering an application
  client and calling with the client-credentials flow. Both routes are live and return HTTP 401
  without a key, so the contracts are public while the data is registered-developer only. The
  University also self-hosts ResearchSpace (DSpace) on its own domain with a live OAI-PMH 2.0
  service advertising thirteen metadata formats, and runs its own Shibboleth identity provider at
  iam.auckland.ac.nz publishing SAML 2.0 metadata scoped to auckland.ac.nz. Its research data
  repository (auckland.figshare.com) and library discovery layer (Ex Libris Primo) are vendor
  tenancies: the data and the DOIs are the University's, the contracts are not, and no vendor
  specification is saved under this slug. The previously catalogued unidirectory.auckland.ac.nz
  staff directory API no longer resolves in DNS and has been removed. There is no open data portal
  and no llms.txt, security.txt, status page, changelog or deprecation policy on any institution host.
