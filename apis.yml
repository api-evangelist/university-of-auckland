  detail: >-
    Re-profiled on 2026-08-30 under the university pipeline's operator axis. The June 2026 profile
    attributed twenty-two Figshare surfaces to this institution — one generic api.figshare.com/v2
    contract split into ten per-tag OpenAPIs and eleven apis[] entries, plus every schema, example,
    collection, ruleset, vocabulary, JSON-LD context, scope, authentication and agentic-access
    artifact derived from it. All of it was Figshare's engineering under Auckland's name and has
    been removed. What replaced it was found by live probe, not by link presence: an institution-run
    Kong developer portal (developer.auckland.ac.nz/prd, 200) and gateway (apis.auckland.ac.nz,
    Kong 404 at root, 401 on both catalog routes) publishing two OpenAPI 3.1.0 documents whose
    servers[] and info.contact are both under auckland.ac.nz; a live OAI-PMH 2.0 provider at
    researchspace.auckland.ac.nz/server/oai/request (Identify returns repositoryName "ResearchSpace
    at The University of Auckland"); a DSpace 7 REST API on the same host returning real
    communities as HAL+JSON; and a Shibboleth/SAML 2.0 identity provider at
    iam.auckland.ac.nz/shibboleth with shibmd:Scope auckland.ac.nz. Confirmed absences, each probed
    rather than assumed - unidirectory.auckland.ac.nz (the one host the June profile called
    institution-owned) fails DNS resolution entirely and its entry was deleted; data.auckland.ac.nz
    redirects to a WordPress login, so there is no open data portal; www.auckland.ac.nz/llms.txt and
    /.well-known/security.txt both 404; no status page, changelog, deprecation policy, published
    scope list or token endpoint. Two live surfaces are correctly labelled tenant rather than
    institution: auckland.figshare.com (AWS WAF challenge, HTTP 202 - live and bot-challenged, not
    dead; DOIs under Figshare's 10.17608 prefix) and auckland.primo.exlibrisgroup.com
    (vid=64UAUCK_INST:UOA, 200). Neither carries a saved contract here.
