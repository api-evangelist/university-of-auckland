  - aid: university-of-auckland:classes-v2
    name: University of Auckland Classes Api V2
    x-operator: institution
    x-operator-evidence: >-
      servers[] targets https://apis.auckland.ac.nz/classes/v2 and info.contact is
      student-recruitment@list.auckland.ac.nz. Published by the University in its own portal.
    description: >-
      Search for scheduled class offerings at the University of Auckland — "Class API is intended
      to provide access to Class attributes, such as ID, Name, Description, Definition etc". A
      single GET /classes operation with sixteen query parameters (class number, term, year,
      subject, catalogue number, course id, academic group, status, component, academic
      organisation, academic career, class type, active flag, and from/size/page paging) returning
      a ClassesList of ClassModel records with meeting patterns. OpenAPI 3.1.0. Live and
      access-controlled - HTTP 401 without a key. Defects preserved verbatim from the University's
      document - info.version reads "3.0" on a v2 API, the operation is tagged "classes" while the
      root tags[] declares only "api", and 400 and 500 responses reuse the success schema.
    humanURL: https://developer.auckland.ac.nz/prd/documentation/api-classes-v2
    baseURL: https://apis.auckland.ac.nz/classes/v2
