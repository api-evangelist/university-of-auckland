  - aid: university-of-auckland:researchspace-rest
    name: ResearchSpace DSpace REST API
    x-operator: institution
    x-operator-evidence: >-
      Self-hosted open-source software on the University's own infrastructure and domain. The
      contract shape is upstream DSpace's, not Auckland engineering, so no specification is saved
      here - saving a generic DSpace spec under an institution's slug is exactly the
      misattribution this profile exists to prevent.
    description: >-
      The HAL+JSON REST API of the University's self-hosted DSpace 7 instance.
      /server/api/core/communities returns the live community tree (A1 Research Outputs Online and
      its siblings) anonymously as application/hal+json; /server/api itself is blocked at the edge
      and /server/api/config/properties returns 405, so the surface is partially open rather than
      uniformly public. Recorded as an institution-operated surface; the contract belongs to
      DSpace.
    humanURL: https://researchspace.auckland.ac.nz/
    baseURL: https://researchspace.auckland.ac.nz/server/api
    tags:
