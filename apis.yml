apis:
  - aid: university-of-auckland:course-catalog-v3
    name: University of Auckland Course Catalog Api V3
    x-operator: institution
    x-operator-evidence: >-
      servers[] targets apis.auckland.ac.nz (the University's own Kong gateway) and info.contact is
      Student Recruitment, student-recruitment@list.auckland.ac.nz. The specification is published
      by the University in its own developer portal. Institution-operated on every axis.
    description: >-
      Read-only access to the University of Auckland course catalogue, described by the University
      as "Exposes some course information by querying CS9 views" — CS9 being its PeopleSoft Campus
      Solutions instance. Twelve operations across a Courses API (courses by subject, course by id)
      and a Reference Data API (terms, subjects, consent codes, component codes, academic
      organisations, groups and careers), plus an operational POST /cache/reload/collections.
      OpenAPI 3.1.0. Live and access-controlled - the route returns HTTP 401 without a key issued
      through the developer portal. Note two defects in the University's own document, preserved
      verbatim rather than silently corrected: servers[0].url is published as
      "httpss://apis.auckland.ac.nz/courses/v3" (the working base is https://), and info.version
      reads "3.0" while the path segment says v3.
    humanURL: https://developer.auckland.ac.nz/prd/documentation/api-course-catalog-v3
    baseURL: https://apis.auckland.ac.nz/courses/v3
