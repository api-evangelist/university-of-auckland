  description: >-
    OAI-PMH metadata harvesting endpoint for the University of Auckland Figshare research repository.
    Supports standard OAI-PMH verbs and multiple metadata schemas (Dublin Core, DataCite, RDF, CERIF XML,
    METS, UKETD_DC), with University of Auckland records exposed via the Figshare portal set.
  humanURL: https://docs.figshare.com/old_docs/OAI-PMH/
  baseURL: https://api.figshare.com/v2/oai
