- aid: university-of-auckland:unidirectory
  name: University Directory API
  description: >-
    A set of public University Directory APIs that allow anyone to search for University of Auckland staff
    and retrieve a summary profile or a full profile of a staff member. Documented as available externally
    without a password (anonymous access). NOTE: the unidirectory.auckland.ac.nz host did not resolve
    from the verification environment, so this entry is based on published documentation references rather
    than a live probe.
  humanURL: https://unidirectory.auckland.ac.nz/apidocs
  tags:
  - Directory
  - Staff
  - Search
  - People
  properties:
